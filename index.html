<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Explainer Short</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  canvas { display: block; }
  /* 2D overlay for on-screen captions, drawn on a separate canvas so Three.js never sees it. */
  #captions { position: absolute; left: 0; top: 0; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="captions"></canvas>
</div>
<script type="module">
  // Which video to run: ?video=<slug>, else the slug in videos/current.txt.
  const q = new URLSearchParams(location.search).get('video');
  const slug = q || (await fetch('/videos/current.txt').then((r) => r.text())).trim();
  await import(`/videos/${slug}/main.js`);
</script>
</body>
</html>
